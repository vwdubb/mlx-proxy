services:
  mlx-proxy:
    build: .
    image: vwdubb/mlx-proxy:latest
    container_name: mlx-proxy
    restart: unless-stopped
    ports:
      - 28081:28081
    environment:
      MLX_HOST: 192.168.11.150
      MLX_PORT: 28080
      MLX_PROXY_PORT: 28081
      TZ: America/Toronto
      # oMLX memory management: set the oMLX API key to enable proactive
      # unloading of other models so the requested one fits. Leave empty to
      # disable (plain pass-through). Optionally tune the free-RAM headroom.
      OMLX_API_KEY: ${OMLX_API_KEY:-}
      OMLX_HEADROOM_MB: 1024
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 4g
