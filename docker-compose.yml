services:
  llm-proxy:
    build: .
    image: vwdubb/llm-proxy:latest
    container_name: llm-proxy
    restart: unless-stopped
    ports:
      - 28080:28080
      - 28001:28001
      - 28002:28002
    environment:
      # listen:host:port per endpoint. Mix hosts freely (MLX + DGX at once).
      ENDPOINTS: "28080:host.docker.internal:8080,28001:spark:8001,28002:spark:8002"
      TZ: America/Toronto
      API_KEY: your-upstream-key   # optional, applied to every endpoint
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 4g
